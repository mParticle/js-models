version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
        interval: daily
        time: "08:00"
        timezone: "America/New_York"
      target-branch: 'chore/dependabot'
      labels: ['dependabot']
      open-pull-requests-limit: 10
      cooldown:
        default-days: 7
    - package-ecosystem: github-actions
      directory: '/'
      schedule:
        interval: weekly
      labels: ['dependabot']
      open-pull-requests-limit: 10
      cooldown:
        default-days: 7
